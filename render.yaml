# Render Blueprint — roami backend
services:
  - type: web
    name: roami-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --graceful-timeout 30
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: roami-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Shared secret for the Next.js on-demand ISR webhook. Must match
      # the REVALIDATE_SECRET env var on Vercel. Auto-generated.
      - key: REVALIDATE_SECRET
        generateValue: true
      - key: WEB_BASE_URL
        value: "https://moruwalk.com"

databases:
  - name: roami-db
    plan: free
    region: singapore
